<body>

<div class="login-page">
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <h1>AviaSAFE</h1>
            <p>Safety Management Platform</p>
        </div>

        <div class="tenant-context" id="tenantContext">
            <i class="fas fa-building"></i>
            <span id="tenantDisplay">Loading...</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="your@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <button type="button" class="btn-google" id="googleBtn" onclick="googleSignIn()">
            <i class="fab fa-google" aria-hidden="true"></i> Sign in with Google
        </button>
        <div id="googleError" class="error-message"></div>

        <div class="role-hint">
            <p><strong><i class="fas fa-shield-alt"></i> Authorized Personnel Only</strong></p>
            <p style="font-size: var(--font-size-xs); color: var(--color-gray-600); margin-top: var(--spacing-sm);">
                This portal is restricted to registered aviation safety personnel.
                Contact your system administrator for access.
            </p>
        </div>

        <div class="footer-links">
            <a href="/">← Back to Home</a>
        </div>
    </div>
</div>

<!-- ===== FIREBASE SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-check-compat.js"></script>

<!-- ===== SHARED FIREBASE CONFIG ===== -->
<script src="/js/firebase.js"></script>

<!-- ===== LOGIN LOGIC ===== -->
<script>
// ============================================================================
// WAIT FOR FIREBASE SDK
// ============================================================================

function waitForFirebase() {
    return new Promise(function(resolve) {
        if (typeof firebase !== 'undefined' && firebase.auth) {
            resolve();
            return;
        }
        var check = setInterval(function() {
            if (typeof firebase !== 'undefined' && firebase.auth) {
                clearInterval(check);
                resolve();
            }
        }, 30);
        setTimeout(function() {
            clearInterval(check);
            resolve();
        }, 10000);
    });
}

// ============================================================================
// SIGN IN FUNCTION — force token refresh for fresh claims
// ============================================================================

async function signIn(email, password) {
    try {
        var userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        var user = userCredential.user;
        var tokenResult = await user.getIdTokenResult(true);
        var claims = tokenResult.claims || {};
        
        return {
            uid: user.uid,
            email: user.email,
            role: claims.role || 'USER',
            tenantId: claims.tenant_id || null,
            claims: claims
        };
    } catch (error) {
        console.error('Sign in error:', error);
        throw error;
    }
}

// ============================================================================
// TENANT RESOLUTION
// ============================================================================

function getTenantFromSubdomain() {
    var hostname = window.location.hostname;
    var parts = hostname.split('.');
    
    if (parts.length >= 2 && parts[1] === 'aviasafesystems') {
        var subdomain = parts[0];
        var reserved = ['www', 'app', 'api', 'caan', 'admin', 'auth', 'docs'];
        if (reserved.indexOf(subdomain) === -1) {
            return subdomain;
        }
    }
    return null;
}

// ============================================================================
// REDIRECT BASED ON ROLE
// ============================================================================

function redirectBasedOnRole(user) {
    var role = user.role || 'USER';
    var redirectUrl = '/safety.html';
    
    if (role === 'SUPER_ADMIN') {
        redirectUrl = '/admin/';
    } else if (role === 'CAAN_SMD') {
        redirectUrl = '/caan.html';
    }
    
    console.log('Redirecting to ' + redirectUrl + ' (role=' + role + ')');
    window.location.href = redirectUrl;
}

// ============================================================================
// PERSISTENT AUTH LISTENER — handles all auth transitions
// ============================================================================

var authRedirectInProgress = false;

function onAuthStateChanged(user) {
    // Prevent multiple simultaneous redirects
    if (authRedirectInProgress) return;
    
    var statusBox = document.getElementById('statusBox');
    var errorDiv = document.getElementById('errorMessage');
    var loginBtn = document.getElementById('loginBtn');
    var loginForm = document.getElementById('loginForm');
    
    if (!user) {
        // Show login form, hide any errors
        if (loginForm) loginForm.style.display = 'block';
        if (errorDiv) errorDiv.style.display = 'none';
        if (loginBtn) loginBtn.disabled = false;
        return;
    }
    
    // User is signed in — fetch fresh claims before redirecting
    authRedirectInProgress = true;
    user.getIdTokenResult(true).then(function(tokenResult) {
        var claims = tokenResult.claims || {};
        var role = claims.role || 'USER';
        var tenantId = claims.tenant_id || null;
        
        console.log('Authenticated as:', user.email, 'role:', role, 'tenant:', tenantId);
        
        // Check if we should redirect (skip if already on a target page)
        var currentPath = window.location.pathname;
        var isOnLoginPage = currentPath === '/login.html' || currentPath === '/';
        
        if (isOnLoginPage) {
            redirectBasedOnRole({ uid: user.uid, email: user.email, role: role, tenantId: tenantId, claims: claims });
        }
    }).catch(function() {
        authRedirectInProgress = false;
    });
}

// ============================================================================
// PAGE LOAD
// ============================================================================

document.addEventListener('DOMContentLoaded', async function() {
    // Resolve tenant display
    var tenantId = getTenantFromSubdomain();
    var displayName = tenantId ? tenantId.charAt(0).toUpperCase() + tenantId.slice(1) + ' Air' : 'Unknown';
    document.getElementById('tenantDisplay').textContent = displayName;
    
    if (tenantId === 'caan') {
        document.getElementById('tenantDisplay').textContent = 'CAAN SMD Regulator';
    } else if (tenantId === 'admin') {
        document.getElementById('tenantDisplay').textContent = 'System Administration';
    }
    
    // Wait for Firebase SDK to be ready, then register persistent listener
    await waitForFirebase();
    firebase.auth().onAuthStateChanged(onAuthStateChanged);
});

// ============================================================================
// FORM HANDLER
// ============================================================================

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var loginBtn = document.getElementById('loginBtn');
    var errorDiv = document.getElementById('errorMessage');
    
    errorDiv.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
    
    try {
        var user = await signIn(email, password);
        
        if (user) {
            console.log('✅ Logged in as:', user.email);
            console.log('   Role:', user.role);
            console.log('   Tenant:', user.tenantId || 'None');
            // The onAuthStateChanged listener will handle the redirect with fresh claims,
            // but call it directly here for immediate response
            redirectBasedOnRole(user);
        }
        
    } catch (error) {
        errorDiv.textContent = error.message || 'Invalid email or password. Please try again.';
        errorDiv.style.display = 'block';
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }
});

// ============================================================================
// GOOGLE SIGN-IN
// ============================================================================

async function googleSignIn() {
    // Block the auth-state listener from redirecting on raw claims before we
    // resolve the real role/tenant from the backend (fresh Google accounts
    // carry no custom claims).
    authRedirectInProgress = true;

    var googleBtn = document.getElementById('googleBtn');
    var errorDiv = document.getElementById('googleError');
    errorDiv.style.display = 'none';
    googleBtn.disabled = true;
    googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    try {
        var provider = new firebase.auth.GoogleAuthProvider();
        var credential = await firebase.auth().signInWithPopup(provider);
        var user = credential.user;
        var token = await user.getIdToken(true);

        // Resolve role/tenant via the backend, which applies the email→tenant
        // fallback for accounts without custom claims.
        var role = 'USER';
        var tenantId = null;
        try {
            var resp = await fetch(window.API_BASE_URL + '/api/v1/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_token: token })
            });
            if (resp.ok) {
                var data = await resp.json();
                role = data.role || 'USER';
                tenantId = data.tenant_id || null;
            }
        } catch (e) {
            console.warn('Google login: backend role resolution failed, using raw claims', e);
        }

        console.log('✅ Google login as:', user.email, 'role:', role, 'tenant:', tenantId || 'None');
        redirectBasedOnRole({ uid: user.uid, email: user.email, role: role, tenantId: tenantId, claims: {} });

    } catch (error) {
        authRedirectInProgress = false;
        var msg = error.message || 'Google sign-in failed. Please try again.';
        if (error.code === 'auth/popup-blocked') {
            msg = 'Popup was blocked. Please allow popups for this site and try again.';
        } else if (error.code === 'auth/operation-not-allowed') {
            msg = 'Google sign-in is not enabled. Contact your administrator.';
        } else if (error.code === 'auth/account-exists-with-different-credential') {
            msg = 'An account already exists with this email. Please sign in with email and password instead.';
        }
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        console.error('Google sign-in error:', error);
    } finally {
        googleBtn.disabled = false;
        googleBtn.innerHTML = '<i class="fab fa-google" aria-hidden="true"></i> Sign in with Google';
    }
}
</script>

</body>
