<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazard Register - AviaSAFE</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0b2a42; margin: 0; }
        .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .nav { background: #0b2a42; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .nav h1 i { margin-right: 0.5rem; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-actions span { font-size: 0.8rem; opacity: 0.8; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header-bar h2 { margin: 0; color: #0b2a42; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; background: #fff; padding: 1rem 1.25rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .filter-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .filter-bar select, .filter-bar input { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85rem; background: #fff; }
        .filter-bar .btn-search { background: #1a6b8a; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .filter-bar .btn-search:hover { background: #0b2a42; }
        .filter-bar .btn-clear { background: transparent; color: #64748b; border: 1px solid #e2e8f0; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
        .table-card table { width: 100%; border-collapse: collapse; }
        .table-card th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; padding: 0.85rem 1rem; text-align: left; border-bottom: 2px solid #e2e8f0; }
        .table-card td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .table-card tbody tr { cursor: pointer; }
        .table-card tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-critical { background: #fde8e8; color: #dc3545; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-medium { background: #fff8e1; color: #f9a825; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .badge-default { background: #f1f5f9; color: #64748b; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-processing { background: #fff3e0; color: #e65100; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
        .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #0b2a42; }
        .stat-card .lbl { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 0.25rem; }
        .loading-state { display: flex; align-items: center; justify-content: center; padding: 3rem; color: #64748b; }
        .loading-state i { font-size: 1.5rem; margin-right: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #64748b; }
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; align-items: stretch; }
            .header-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
    <h1><i class="fas fa-exclamation-triangle"></i> Hazard Register</h1>
    <div class="nav-actions">
        <span id="userDisplay"></span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</nav>

<div class="page">
    <div class="header-bar">
        <h2><i class="fas fa-list"></i> All Hazards</h2>
        <div>
            <a href="/safety.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <a href="/hazards/create.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> New Hazard</a>
        </div>
    </div>

    <div id="statsRow" class="stats-row"></div>

    <div class="header-bar" style="margin-top:2rem;">
        <h2><i class="fas fa-clipboard-check"></i> Corrective Action Progress</h2>
        <div>
            <a href="/can_cap/cans.html" class="btn btn-outline btn-sm"><i class="fas fa-list"></i> View All CANs</a>
        </div>
    </div>
    <div id="capStatsRow" class="stats-row"></div>

    <div class="filter-bar">
        <label>Status:</label>
        <select id="filterStatus"><option value="">All</option></select>
        <label>Priority:</label>
        <select id="filterPriority"><option value="">All</option></select>
        <label>Source:</label>
        <select id="filterSource"><option value="">All</option></select>
        <label>Taxonomy:</label>
        <select id="filterTaxonomy"><option value="">All</option></select>
        <input type="text" id="filterSearch" placeholder="Search hazard ID, title..." style="flex:1;min-width:150px;">
        <button class="btn-search" onclick="loadHazards()"><i class="fas fa-search"></i> Search</button>
        <button class="btn-clear" onclick="clearFilters()"><i class="fas fa-times"></i> Clear</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Hazard ID</th>
                    <th>Title</th>
                    <th>Source</th>
                    <th>Taxonomy</th>
                    <th>Priority</th>
                    <th>Risk Level</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody id="hazardsBody"></tbody>
        </table>
        <div id="loadingIndicator" class="loading-state" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> Loading hazards...
        </div>
        <div id="emptyIndicator" class="empty-state" style="display:none;">
            <i class="fas fa-inbox" style="font-size:2rem;margin-bottom:0.5rem;"></i>
            <p>No hazards found.</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/api/client.js"></script>
<script src="/js/hazards.js"></script>
<script src="/js/can_cap.js"></script>
<script>
let currentUser = null;

firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { window.location.href = '/login.html'; return; }
    currentUser = user;
    document.getElementById('userDisplay').textContent = user.email;
    populateFilters();
    loadHazards();
    loadStats();
    loadCapStats();
});

function populateFilters() {
    const statusSel = document.getElementById('filterStatus');
    HAZARD_STATUSES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        statusSel.appendChild(opt);
    });
    const prioritySel = document.getElementById('filterPriority');
    HAZARD_PRIORITIES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        prioritySel.appendChild(opt);
    });
    const sourceSel = document.getElementById('filterSource');
    HAZARD_SOURCES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sourceSel.appendChild(opt);
    });
    const taxSel = document.getElementById('filterTaxonomy');
    HAZARD_TAXONOMIES.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        taxSel.appendChild(opt);
    });
}

function getFilters() {
    return {
        status: document.getElementById('filterStatus').value,
        priority: document.getElementById('filterPriority').value,
        source: document.getElementById('filterSource').value,
        taxonomy: document.getElementById('filterTaxonomy').value,
        search: document.getElementById('filterSearch').value,
    };
}

function clearFilters() {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterPriority').value = '';
    document.getElementById('filterSource').value = '';
    document.getElementById('filterTaxonomy').value = '';
    document.getElementById('filterSearch').value = '';
    loadHazards();
}

async function loadHazards() {
    const tbody = document.getElementById('hazardsBody');
    const loading = document.getElementById('loadingIndicator');
    const empty = document.getElementById('emptyIndicator');
    tbody.innerHTML = '';
    loading.style.display = 'flex';
    empty.style.display = 'none';

    try {
        const data = await HazardsAPI.list(getFilters());
        loading.style.display = 'none';
        if (!data || data.length === 0) {
            empty.style.display = 'block';
            return;
        }
        data.forEach(h => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', () => {
                window.location.href = `/hazards/detail.html?id=${h.id}`;
            });
            const riskClass = hazardRiskBadgeClass(h.risk_level);
            const statusClass = hazardStatusBadgeClass(h.status);
            const priorityClass = hazardPriorityBadgeClass(h.priority);
            tr.innerHTML = `
                <td><strong>${h.hazard_id || h.id}</strong></td>
                <td>${h.title}</td>
                <td>${h.source || '-'}</td>
                <td>${h.taxonomy || '-'}</td>
                <td><span class="badge ${priorityClass}">${h.priority}</span></td>
                <td><span class="badge ${riskClass}">${h.risk_level || 'N/A'}</span></td>
                <td><span class="badge ${statusClass}">${h.status}</span></td>
                <td>${h.assigned_to || '-'}</td>
                <td>${formatDate(h.created_at)}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        loading.style.display = 'none';
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#dc3545;padding:2rem;"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</td></tr>`;
    }
}

async function loadStats() {
    try {
        const stats = await HazardsAPI.getStats();
        const container = document.getElementById('statsRow');
        const statuses = stats.by_status || {};
        container.innerHTML = Object.entries(statuses).map(([key, val]) =>
            `<div class="stat-card"><div class="num">${val}</div><div class="lbl">${key}</div></div>`
        ).join('') +
            `<div class="stat-card"><div class="num">${stats.total || 0}</div><div class="lbl">Total</div></div>`;
    } catch (e) {
        console.error('Stats error:', e);
    }
}

async function loadCapStats() {
    const container = document.getElementById('capStatsRow');
    if (!container) return;
    try {
        const stats = await CanCapAPI.getStats();
        const canStatuses = (stats.cans && stats.cans.by_status) || {};
        const canTotal = (stats.cans && stats.cans.total) || 0;
        const capTotal = (stats.caps && stats.caps.total) || 0;
        if (canTotal === 0 && capTotal === 0) {
            container.innerHTML = `
                <div class="stat-card" style="grid-column:1/-1;">
                    <div class="lbl" style="font-size:0.85rem;text-transform:none;letter-spacing:0;">No corrective actions (CANs/CAPs) yet. Hazards flagged for correction will appear here.</div>
                </div>`;
            return;
        }
        const statusCards = Object.entries(canStatuses).map(([key, val]) =>
            `<div class="stat-card"><div class="num">${val}</div><div class="lbl">CAN ${key}</div></div>`
        ).join('');
        container.innerHTML = statusCards +
            `<div class="stat-card" style="background:#0b2a42;"><div class="num" style="color:#fff;">${canTotal}</div><div class="lbl" style="color:#cbd5e1;">Total CANs</div></div>` +
            `<div class="stat-card" style="background:#1a6b8a;"><div class="num" style="color:#fff;">${capTotal}</div><div class="lbl" style="color:#e0f2fe;">CAPs</div></div>`;
    } catch (e) {
        container.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:1rem;">Error loading CAN/CAP data.</p>';
        console.error('Cap stats error:', e);
    }
}

async function logout() {
    try { await firebase.auth().signOut(); window.location.href = '/'; }
    catch (e) { console.error(e); }
}
</script>
</body>
</html>
